name: Close stale pull requests

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Only log which PRs would be marked or closed; change nothing"
        type: boolean
        default: false

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/stale@v11
        with:
          days-before-pr-stale: 21
          days-before-pr-close: 7
          days-before-issue-stale: -1
          days-before-issue-close: -1
          stale-pr-label: stale
          exempt-pr-labels: keep-open,dependencies
          exempt-draft-pr: false
          stale-pr-message: >
            This pull request has had no activity for 3 weeks. It closes in 7 days
            unless somebody comments or pushes. To keep it open for longer, add the
            `keep-open` label.
          close-pr-message: >
            Closed after 4 weeks with no activity. Reopen it if the work continues.
          operations-per-run: 200
          debug-only: ${{ inputs.dry_run }}
